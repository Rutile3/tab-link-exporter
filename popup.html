<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tab Link Exporter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div>
        <h1>Tab Link Exporter</h1>
        <p>開いているタブのリンクを一覧化します。</p>
      </div>
      <button id="refreshButton" class="icon-button" type="button" title="再取得" aria-label="タブ一覧を再取得">
        ↻
      </button>
    </header>

    <section class="settings" aria-label="出力設定">
      <label class="field">
        <span>取得範囲</span>
        <select id="scopeSelect">
          <option value="current">現在のウィンドウ</option>
          <option value="all">すべてのウィンドウ</option>
        </select>
      </label>

      <label class="field">
        <span>出力形式</span>
        <select id="formatSelect">
          <option value="url">URLのみ</option>
          <option value="title-url">タイトル + URL</option>
          <option value="markdown">Markdown</option>
          <option value="scrapbox">Scrapbox</option>
          <option value="csv">CSV</option>
          <option value="json">JSON</option>
          <option value="custom">カスタム</option>
        </select>
      </label>

      <label id="customTemplateField" class="field custom-template-field" hidden>
        <span>カスタムテンプレート</span>
        <textarea
          id="customTemplateInput"
          class="custom-template-input"
          rows="3"
          spellcheck="false"
          aria-describedby="customTemplateHelp"
          placeholder="{{title}}&#10;{{url}}"
        ></textarea>
        <small id="customTemplateHelp" class="field-help">
          利用可能: {{title}}, {{url}}
        </small>
      </label>

      <label class="checkbox">
        <input id="webOnlyCheckbox" type="checkbox" checked>
        <span>Webページのみ（http / https）</span>
      </label>
    </section>

    <section class="result-section">
      <div class="result-heading">
        <label for="resultText">取得結果</label>
        <span id="tabCount" class="count">0件</span>
      </div>
      <textarea id="resultText" readonly spellcheck="false" placeholder="タブの一覧がここに表示されます"></textarea>
    </section>

    <div class="actions">
      <button id="copyButton" class="primary" type="button">クリップボードにコピー</button>
    </div>

    <p id="statusMessage" class="status" role="status" aria-live="polite"></p>

    <footer class="footer">
      <a
        href="https://docs.google.com/forms/d/e/1FAIpQLScsMys5wqqgyUW79F-B1XBrDl19tQJP19n8r40RsgwNLMXQxw/viewform?usp=pp_url&amp;entry.1006266992=Tab+Link+Exporter"
        target="_blank"
        rel="noopener noreferrer"
      >フィードバック</a>
      <span aria-hidden="true">・</span>
      <a
        href="https://ofuse.me/rutile3"
        target="_blank"
        rel="noopener noreferrer"
      >OFUSEで応援</a>
    </footer>
  </main>

  <script src="popup.js"></script>
</body>
</html>
